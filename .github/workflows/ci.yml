name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Tests spawn real PTYs; keep them serial enough to stay stable on runners.
  RUST_BACKTRACE: "1"

jobs:
  macos:
    name: macOS (build + test)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      # Oxide types commands at the user's prompt, so those commands have to
      # parse in whatever shell they use. The runner already has zsh, bash,
      # sh, dash, ksh, tcsh and csh; add the two popular non-POSIX shells so
      # the cross-shell tests cover them for real instead of by assumption.
      - name: Install alternative shells
        run: brew install fish nushell
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --all-targets
      - name: Test
        run: cargo test

  linux:
    name: Linux (build + test)
    runs-on: ubuntu-latest
    # A full build, not `cargo check`: the Apple-only crates (objc, block)
    # only bite at link time, so this is what keeps mac-isms out. Tests
    # spawn real PTYs but open no window, so no display is needed.
    steps:
      - uses: actions/checkout@v4
      - name: Install GPUI system dependencies and alternative shells
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libfontconfig1-dev libfreetype6-dev \
            libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libx11-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libssl-dev libnotify-bin \
            fish zsh dash
      # The cross-shell tests drive real zsh and fish sessions, and both trip
      # over the runner image on first use: zsh's compinit finds group-writable
      # completion dirs and stops at an "insecure directories" prompt (which
      # then swallows the test's first keystroke), and fish's first runs race
      # each other creating ~/.local/share/fish and print warnings, which the
      # tests read as the shell rejecting the command.
      - name: Make zsh and fish quiet on first use
        run: |
          zsh -c 'autoload -Uz compaudit; compaudit' 2>/dev/null | xargs -r sudo chmod g-w,o-w || true
          fish -c true
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --all-targets
      - name: Test
        run: cargo test
